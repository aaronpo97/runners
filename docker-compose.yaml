services:
  worker:
    image: myoung34/github-runner:latest
    environment:
      REPO_URL: https://github.com/aaronpo97/the-biergarten-app
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      RUNNER_WORKDIR_ROOT: /tmp/runner/work # Each replica gets its own <root>/<runner name> subdir
      RUNNER_SCOPE: 'repo'
      LABELS: linux,x64
      # Reuse mode forces DISABLE_AUTOMATIC_DEREGISTRATION=true (it won't start otherwise),
      # which leaves a stale offline runner behind on every restart. Disabling reuse lets the
      # image's built-in SIGTERM trap deregister the runner on container stop instead.
      CONFIGURED_ACTIONS_RUNNER_FILES_DIR: ''
      DISABLE_AUTOMATIC_DEREGISTRATION: 'false'
    security_opt:
      # Disable SELinux labeling so the container can manage other Docker containers
      - label:disable
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
      - '/tmp/runner:/tmp/runner'
      # Docker commands run on the host but use paths from inside the container,
      # so this directory must be mounted at the same path in both environments.
    env_file:
      - .env
