services:
  worker:
    image: myoung34/github-runner:latest
    network_mode: host
    environment:
      REPO_URL: https://github.com/aaronpo97/the-biergarten-app
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      # Each replica gets its own subdirectory: <root>/<runner name>
      RUNNER_WORKDIR_ROOT: /tmp/runner/work
      RUNNER_SCOPE: 'repo'
      LABELS: linux,x64
      # Disable runner config reuse so the image's SIGTERM trap
      # deregisters the runner on container stop
      CONFIGURED_ACTIONS_RUNNER_FILES_DIR: ''
      DISABLE_AUTOMATIC_DEREGISTRATION: 'false'
    security_opt:
      # Disable SELinux labelling so the container can manage other containers
      - label:disable
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
      # Docker commands execute on the host but resolve paths from inside the
      # container, so the work directory must be mounted at the same path in both
      - '/tmp/runner:/tmp/runner'
